name: Build openGym for Unraid

on:
  push:
    branches: [main]
    paths:
      - api/**
      - frontend/**
      - web/**
      - catalogue/media/**
      - deploy/unraid/**
      - .github/workflows/unraid-custom.yml
      - LICENSE
      - NOTICE.md
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: opengym-unraid-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build custom API from fork
        run: docker build --target default -t opengym-fork-api:build ./api
      - name: Build custom web from fork
        run: docker build -f web/Dockerfile --build-arg APP_BUILD=${GITHUB_SHA::12} -t opengym-fork-web:build .
      - name: Package custom all-in-one image
        run: |
          docker build -f deploy/unraid/Dockerfile \
            --build-arg OPENGYM_API_IMAGE=opengym-fork-api:build \
            --build-arg OPENGYM_WEB_IMAGE=opengym-fork-web:build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg OPENGYM_VERSION="fork-${GITHUB_SHA::12}" \
            -t ghcr.io/elmakus/opengym:sha-${GITHUB_SHA::12} \
            -t ghcr.io/elmakus/opengym:latest .
      - name: Smoke test API and web
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opengym-smoke-data"
          docker run -d --name opengym-smoke --rm \
            -p 127.0.0.1:18031:80 \
            -v "$RUNNER_TEMP/opengym-smoke-data:/data" \
            -e ORIGIN=https://gym.makowski.li \
            -e RP_ID=gym.makowski.li \
            -e PASSWORD_LOGIN=true \
            -e FIRST_USER_ADMIN=true \
            ghcr.io/elmakus/opengym:latest
          trap 'docker logs --tail 100 opengym-smoke || true; docker rm -f opengym-smoke || true' EXIT
          for i in {1..75}; do
            if curl -fsS http://127.0.0.1:18031/api/health >/dev/null && \
               curl -fsS http://127.0.0.1:18031/ >/dev/null; then
              echo 'openGym API + frontend healthy'
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Publish images to GHCR
        run: |
          docker push ghcr.io/elmakus/opengym:sha-${GITHUB_SHA::12}
          docker push ghcr.io/elmakus/opengym:latest
