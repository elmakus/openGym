name: ATP2 experimental Android debug APK

on:
  push:
    branches: [experiment/atp2-book-engine-v2]
    paths:
      - 'api/training-control/**'
      - 'api/engine/**'
      - 'frontend/**'
      - '.github/workflows/atp2-experimental-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atp2-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    if: github.ref == 'refs/heads/experiment/atp2-book-engine-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout experimental ATP2 branch
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install mobile dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build mobile assets and sync Capacitor
        working-directory: frontend
        run: npm run build:mobile

      - name: Run Android JVM tests and build test-only APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon testSideloadDebugUnitTest assembleSideloadDebug

      - name: Identify APK and archive checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp frontend/android/app/build/outputs/apk/sideload/debug/*.apk dist/openGym-ATP2-experiment-debug.apk
          sha256sum dist/*.apk > dist/openGym-ATP2-experiment-debug.apk.sha256

      - name: Upload isolated test build (no release, no install)
        uses: actions/upload-artifact@v4
        with:
          name: openGym-ATP2-experimental-debug-apk
          path: dist/*
          retention-days: 14
