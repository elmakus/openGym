name: Unraid Engine v2 smoke (integration only)

on:
  push:
    branches: [integration/engine-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-smoke:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/integration/engine-v2') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'integration/engine-v2' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Build fork API
        run: docker build --target default -t opengym-fork-api:staging ./api
      - name: Build fork web
        run: docker build -f web/Dockerfile -t opengym-fork-web:staging .
      - name: Fetch pinned s6 archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/unraid/.build-assets
          for asset in s6-overlay-noarch.tar.xz s6-overlay-x86_64.tar.xz s6-overlay-symlinks-arch.tar.xz s6-overlay-symlinks-noarch.tar.xz; do
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 4 --connect-timeout 15 --max-time 120 \
              "https://github.com/just-containers/s6-overlay/releases/download/v3.2.3.2/$asset" \
              -o "deploy/unraid/.build-assets/$asset"
          done
      - name: Build all-in-one Unraid image
        run: |
          docker build -f deploy/unraid/Dockerfile \
            --build-arg OPENGYM_API_IMAGE=opengym-fork-api:staging \
            --build-arg OPENGYM_WEB_IMAGE=opengym-fork-web:staging \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg OPENGYM_VERSION="staging-${GITHUB_SHA::12}" \
            -t opengym-unraid:staging .
      - name: Isolated API and frontend smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staging-gym-data"
          docker run -d --name gym-stage --rm -p 127.0.0.1:18031:80 \
            -v "$RUNNER_TEMP/staging-gym-data:/data" \
            -e ORIGIN=https://gym.example.invalid \
            -e RP_ID=gym.example.invalid -e PASSWORD_LOGIN=true -e FIRST_USER_ADMIN=true \
            opengym-unraid:staging
          trap 'docker logs --tail 100 gym-stage || true; docker rm -f gym-stage || true' EXIT
          for i in {1..75}; do
            if curl -fsS http://127.0.0.1:18031/api/health >/dev/null && curl -fsS http://127.0.0.1:18031/ >/dev/null; then
              echo 'isolated staging smoke PASS'
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Publish tested Engine v2 image (not latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/integration/engine-v2'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag opengym-unraid:staging ghcr.io/elmakus/opengym:engine-v2-test
          docker tag opengym-unraid:staging ghcr.io/elmakus/opengym:engine-v2-${GITHUB_SHA::12}
          docker push ghcr.io/elmakus/opengym:engine-v2-${GITHUB_SHA::12}
          docker push ghcr.io/elmakus/opengym:engine-v2-test
