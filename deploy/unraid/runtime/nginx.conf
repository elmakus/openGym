# openGym single container — main nginx config.
#
# Written from scratch for an UNPRIVILEGED master (s6 drops nginx to the `nginx`
# account before exec): no `user` directive, the pid and every temp path live under
# /run/nginx, which the boot init creates with that account's ownership. The distro
# config this replaces runs a root master and writes pid/temp state to /var/run and
# /var/lib/nginx, which a non-root master cannot do.
#
# Logs go to a fifo that the boot init creates (mode 0666) and the service's run
# script relays to the container's stdout — an unprivileged process cannot re-open
# /dev/stdout or /dev/stderr here (see nginx/run for the full reason). Both the
# access and the error stream share it; `docker logs` shows them merged, which is
# what the runtime does with stderr anyway.
#
# The site config (upstream's web/nginx.conf.template, rendered at boot) is pulled
# in at the bottom of http{}.

# Two workers, not `auto`: `auto` takes one per host thread, so a 32-thread server
# would run 32 nginx processes for a personal app. Two covers a reload without
# dropping connections and costs nothing.
worker_processes 2;
pid /run/nginx/nginx.pid;
error_log /run/nginx/log.pipe warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer"';
    access_log /run/nginx/log.pipe main;

    sendfile on;
    keepalive_timeout 65;

    # All writable state confined to one directory the nginx account owns.
    client_body_temp_path /run/nginx/client_temp;
    proxy_temp_path       /run/nginx/proxy_temp;
    fastcgi_temp_path     /run/nginx/fastcgi_temp;
    uwsgi_temp_path       /run/nginx/uwsgi_temp;
    scgi_temp_path        /run/nginx/scgi_temp;

    include /run/nginx/site.conf;
}
